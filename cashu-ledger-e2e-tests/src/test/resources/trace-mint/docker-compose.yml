# Minimal real cashu-mint stack for the trace capture E2E (T039), distilled from the live
# staging docker-compose.staging.yml. Provides a real mint (real keysets, Lightning quotes
# auto-settled by phoenixd-mock, quotes persisted by payment-adapter-rest) plus a strfry relay
# for the trace ledger to consume. Images are the current registry set; pull_policy left default
# so Testcontainers/compose can fetch them once and cache.
services:
  cashu-vault-db:
    image: postgres:16
    environment:
      POSTGRES_DB: cashu_vault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cashu_vault"]
      interval: 5s
      timeout: 3s
      retries: 20

  payment-adapter-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payment_gateway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_gateway"]
      interval: 5s
      timeout: 3s
      retries: 20

  # HashiCorp Vault — the post-V3 secrets backend for keyset private keys. Dev mode with a fixed
  # root token; secrets are seeded by vault-init and read by the mint's HCKeyVault at signing time.
  hashicorp-vault:
    image: hashicorp/vault:1.18
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

  # Enables the kv-v2 "cashu" engine and writes the test keyset's private keys to the exact paths
  # HCKeyVault expects: cashu/keys/{mintId}/{keySetId}/{amount}. Mirrors the DB rows seeded by
  # vault-seed (which carry the matching vault_path), so the mint reads metadata from the vault DB
  # and the secret from HashiCorp.
  vault-init:
    image: hashicorp/vault:1.18
    depends_on:
      hashicorp-vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://hashicorp-vault:8200
      VAULT_TOKEN: dev-root-token
    volumes:
      - ./config/seed-hashicorp.sh:/seed-hashicorp.sh:ro
    entrypoint: ["/bin/sh", "/seed-hashicorp.sh"]
    restart: "no"

  cashu-vault-jpa:
    image: docker.398ja.xyz/cashu-vault-jpa:latest
    environment:
      SERVER_PORT: "3333"
      SPRING_DATASOURCE_URL: jdbc:postgresql://cashu-vault-db:5432/cashu_vault
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      cashu-vault-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Seeds the vault DB with the mint, keyset, and key metadata rows. Each t_key row carries the
  # vault_path that points at the HashiCorp secret written by vault-init (no private key in the DB).
  # Runs after Flyway has migrated the schema (vault-jpa healthy) so t_key has the vault_path column.
  vault-seed:
    image: postgres:16
    volumes:
      - ./config/seed-vault.sql:/seed-vault.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["until pg_isready -h cashu-vault-db -U postgres; do sleep 1; done && PGPASSWORD=postgres psql -h cashu-vault-db -U postgres -d cashu_vault -f /seed-vault.sql && echo 'Vault seeded'"]
    depends_on:
      cashu-vault-jpa:
        condition: service_healthy

  payment-adapter-rest:
    image: docker.398ja.xyz/payment-adapter-rest:latest
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-adapter-db:5432/payment_gateway
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      GATEWAY_WALLET_ENABLED: "true"
      GATEWAY_WALLET_MINT_URL: http://cashu-mint-rest:7777
      GATEWAY_WALLET_DATABASE_URL: jdbc:postgresql://payment-adapter-db:5432/payment_gateway
      GATEWAY_WALLET_DATABASE_USERNAME: postgres
      GATEWAY_WALLET_DATABASE_PASSWORD: postgres
      GATEWAY_WALLET_VOUCHER_FIXED_BACKING_SATS: "1"
      GATEWAY_WALLET_VOUCHER_MINIMAL_BACKING_SATS: "10"
      GATEWAY_WALLET_VOUCHER_SATS_PER_MINOR_UNIT: "1"
      GATEWAY_WALLET_VOUCHER_PLATFORM_FEE_RATE: "0.025"
    depends_on:
      payment-adapter-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  phoenixd-mock:
    image: docker.398ja.xyz/phoenixd-mock:latest
    pull_policy: missing
    environment:
      SERVER_PORT: "9740"
      PHOENIXD_AUTOPAY_ENABLED: "true"
      PHOENIXD_AUTO_SETTLE_DELAY_SECONDS: "2"
      PHOENIXD_WEBHOOK_BASE_URL: http://payment-adapter-rest:8080

  cashu-mint-rest:
    image: docker.398ja.xyz/cashu-mint-rest:latest
    environment:
      SERVER_PORT: "7777"
      CASHU_VAULT_BASE_URL: http://cashu-vault-jpa:3333
      VAULT_BASE_URL: http://cashu-vault-jpa:3333
      CASHU_GATEWAY_BASE_URL: http://payment-adapter-rest:8080
      GATEWAY_API_BASE_URL: http://payment-adapter-rest:8080
      PHOENIXD_BASE_URL: http://phoenixd-mock:9740
      MINT_PRELOAD_ENABLED: "true"
      MINT_PRELOAD_JSON_INPUT: file:/app/config/preload-test-data.json
      MINT_WEBHOOK_SECRET: e2e-test-webhook-secret
      # HashiCorp backend: the mint's HCKeyVault reads keyset private keys from Vault at signing
      # time. Keys are pre-seeded (DB rows via vault-seed, secrets via vault-init), so the preload
      # finds every amount already present and skips the raw-key POST that needs no backend.
      VAULT_HASHI_ENABLED: "true"
      VAULT_BACKEND: HASHICORP
      VAULT_HASHI_URI: http://hashicorp-vault:8200
      VAULT_HASHI_AUTH_METHOD: token
      VAULT_HASHI_AUTH_TOKEN: dev-root-token
      VAULT_HASHI_ENGINE_MOUNT: cashu
    volumes:
      - ./config/preload-test-data.json:/app/config/preload-test-data.json:ro
    ports:
      - "7777"
    depends_on:
      cashu-vault-jpa:
        condition: service_healthy
      payment-adapter-rest:
        condition: service_healthy
      vault-seed:
        condition: service_completed_successfully
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7777/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  nostr-relay:
    image: dockurr/strfry:latest
    # Disable the default write-policy whitelist (so the test producer key may publish) and raise the
    # fd limit, mirroring the integration-test relay setup.
    command: ["sh", "-c", "sed -i -e 's|plugin = .*|plugin = \"\"|' -e 's|^[[:space:]]*nofiles[[:space:]]*=.*|    nofiles = 0|' /etc/strfry.conf.default && exec /app/strfry.sh"]
    tmpfs:
      - /app/strfry-db
    ports:
      - "7777"
