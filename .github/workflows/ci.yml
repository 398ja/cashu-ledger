name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with Maven
        run: ./mvnw -q verify
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
          if-no-files-found: ignore
      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec
          path: '**/target/jacoco.exec'
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: '**/target/site/jacoco/jacoco.xml'
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/target/surefire-reports/*.xml'

  # E2E tests run with both autopay modes to verify payment flows
  e2e-tests:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        autopay: [true, false]
    env:
      PHOENIXD_AUTOPAY_ENABLED: ${{ matrix.autopay }}
      PHOENIXD_AUTO_SETTLE_DELAY_SECONDS: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build gateway-app
        run: ./mvnw package -pl gateway-plugin/gateway-app -am -DskipTests -q
      - name: Start infrastructure
        run: |
          docker compose -f docker-compose.gateway-e2e.yml up -d --build
          sleep 30
      - name: Run E2E Tests (autopay=${{ matrix.autopay }})
        run: ./mvnw verify -Pe2e-gateway -pl gateway-plugin/gateway-e2e -Dtest.autopay=${{ matrix.autopay }}
      - name: Stop infrastructure
        if: always()
        run: docker compose -f docker-compose.gateway-e2e.yml down -v
      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports-autopay-${{ matrix.autopay }}
          path: '**/target/allure-results'
          if-no-files-found: ignore
