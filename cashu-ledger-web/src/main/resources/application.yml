server:
  port: 6060

ledger:
  web:
    relays:
      - wss://relay.imani.casa
    timeout: 30s
    cache-ttl: 30s
    api-base: https://staging.imani.casa/api/v1
    storage:
      enabled: ${LEDGER_WEB_STORAGE_ENABLED:false}
      path: ${LEDGER_WEB_STORAGE_PATH:${user.home}/.cashu-ledger/ndb}
      max-size-bytes: ${LEDGER_WEB_STORAGE_MAX_SIZE:536870912}
      event-ttl: ${LEDGER_WEB_STORAGE_TTL:30d}

spring:
  thymeleaf:
    cache: false

  security:
    user:
      name: disabled
      password: disabled
