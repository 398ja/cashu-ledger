apiVersion: v1
kind: Service
metadata:
  name: {{ include "cashu-ledger-web.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "cashu-ledger-web.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
